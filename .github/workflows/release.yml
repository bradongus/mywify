name: Release

# Builds the Windows + Linux + macOS installers and the Android APK/AAB, and
# publishes them to a GitHub Release on every tag. Download buttons on the
# website resolve to /releases/latest/download/{name}, so artifacts are renamed
# to stable filenames before upload.
#
# Secrets required (repo Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of release.keystore (signed release APK)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the Android job still succeeds but produces an UNSIGNED APK.
#
# Optional (removes the Windows "unknown publisher" SmartScreen warning):
#   WIN_CSC_LINK          base64 of a code-signing .pfx (OV/EV cert from a CA,
#                         or exported from Azure Trusted Signing)
#   WIN_CSC_KEY_PASSWORD  password for that .pfx
# When both are absent the Windows build stays UNSIGNED (current behavior).

on:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "20"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      # allow-scripts in the root package.json blocks Electron's postinstall,
      # so the binary never downloads; fetch it explicitly.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Publish C# hotspot helper
        working-directory: apps/hotshare-win/csharp
        run: dotnet publish -c Release -r win-x64 --self-contained -o publish

      - name: Build shared-core (types consumed by the app)
        run: npm run build --workspace=@hotshare/shared-core

      - name: Compile TypeScript
        working-directory: apps/hotshare-win
        run: npx tsc

      # Build the admin dashboard SPA into apps/hotshare-win/src/renderer/public
      # (electron-builder bundles it from there). Without this the packaged app
      # has no index.html and the dashboard shows "Not found".
      - name: Build admin SPA
        run: npm run build --workspace=packages/admin-spa

      # electron-builder + npm workspaces bug (#7103): "installing production
      # dependencies" runs `npm install --production` inside the app dir, which
      # prunes the workspace root (electron-builder #7103) and then dies with
      # app-builder.exe ENOENT. Staging the app's prod deps into the app dir
      # first makes installOrRebuild skip the install and only rebuild native
      # modules (better-sqlite3 for Electron).
      - name: Stage app production dependencies
        run: python tools/stage-app-deps.py . apps/hotshare-win

      - name: Configure Windows code signing
        if: ${{ secrets.WIN_CSC_LINK != '' }}
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Decode to a temp file first so a malformed secret can't fail the
          # whole build. If the value isn't valid base64, build UNSIGNED and warn.
          # Use a unix-style path (cygpath) so the backslashes in $RUNNER_TEMP
          # don't break the file write / electron-builder lookup on Windows.
          PFX_DIR="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          PFX="$PFX_DIR/hotshare.pfx"
          if echo "$WIN_CSC_LINK" | base64 -d > "$PFX.tmp" 2>/dev/null && [ -s "$PFX.tmp" ]; then
            mv "$PFX.tmp" "$PFX"
            echo "CSC_LINK=$PFX" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Code signing enabled."
          else
            echo "WARNING: WIN_CSC_LINK is set but is not valid base64 — building UNSIGNED."
          fi

      - name: Build NSIS installer
        working-directory: apps/hotshare-win
        # --publish never: electron-builder would auto-publish on a tag and
        # fight the softprops release step below; it just assembles the exe.
        # If CSC_LINK is set (above), electron-builder signs both the app exe
        # and the NSIS installer with signtool, removing the "unknown publisher".
        run: npx electron-builder --win --publish never

      - name: Rename installer for stable download URL
        shell: bash
        working-directory: apps/hotshare-win/dist
        run: |
          shopt -s nullglob
          for f in *.exe; do
            if [[ "$f" != "hotshare-setup.exe" ]]; then
              mv "$f" "hotshare-setup.exe"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/hotshare-win/dist/hotshare-setup.exe

  build-linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Build shared-core (types consumed by the app)
        run: npm run build --workspace=@hotshare/shared-core

      - name: Compile TypeScript
        working-directory: apps/hotshare-win
        run: npx tsc

      - name: Build admin SPA
        run: npm run build --workspace=packages/admin-spa

      - name: Stage app production dependencies
        run: python3 tools/stage-app-deps.py . apps/hotshare-win

      - name: Build Linux packages
        working-directory: apps/hotshare-win
        run: npx electron-builder --linux --publish never

      - name: Rename artifacts for stable download URLs
        shell: bash
        working-directory: apps/hotshare-win/dist
        run: |
          shopt -s nullglob
          for f in *.AppImage; do mv "$f" "hotshare-linux.AppImage"; done
          for f in *.deb; do mv "$f" "hotshare-linux.deb"; done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: apps/hotshare-win/dist

  build-macos:
    name: macOS disk image
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Build shared-core (types consumed by the app)
        run: npm run build --workspace=@hotshare/shared-core

      - name: Compile TypeScript
        working-directory: apps/hotshare-win
        run: npx tsc

      - name: Build admin SPA
        run: npm run build --workspace=packages/admin-spa

      - name: Stage app production dependencies
        run: python3 tools/stage-app-deps.py . apps/hotshare-win

      - name: Build macOS dmg
        working-directory: apps/hotshare-win
        # Unsigned (no Apple certs in CI) — users can right-click → Open past
        # Gatekeeper. Add mac.identity + notarization later if needed.
        run: npx electron-builder --mac --publish never

      - name: Rename artifact for stable download URL
        shell: bash
        working-directory: apps/hotshare-win/dist
        run: |
          shopt -s nullglob
          for f in *.dmg; do mv "$f" "hotshare-mac.dmg"; done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: apps/hotshare-win/dist

  build-android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The preBuild task builds the admin SPA with vite, so the workspace must
      # be installed before Gradle runs.
      - name: Install workspace dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Wrapper jar is not committed, so drive Gradle directly (AGP 8.7 needs
      # Gradle >= 8.9; the repo pins 8.11.1).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            # Persistent keystore from the ANDROID_KEYSTORE_BASE64 secret →
            # identical signature on every build, so in-place upgrades work.
            echo "$KEYSTORE_B64" | base64 -d > apps/hotshare-android/app/release.keystore
            echo "Using provided release keystore (stable signature)."
          else
            # Fallback: generate a throwaway keystore so the APK is still signed
            # and installable. Upgrades then require an uninstall.
            echo "WARNING: no ANDROID_KEYSTORE_BASE64 secret - generating a throwaway keystore."
            keytool -genkeypair -v \
              -keystore apps/hotshare-android/app/release.keystore \
              -alias hotshare -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass hotshare -keypass hotshare \
              -dname "CN=hotshare,O=hotshare,C=US"
          fi

      - name: Build release APK + AAB
        working-directory: apps/hotshare-android
        env:
          # storeFile falls back to app/release.keystore (written above). Use the
          # provided secrets when set; otherwise fall back to the dev keystore
          # credentials generated above so the APK is still signed.
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'hotshare' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'hotshare' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'hotshare' }}
        run: gradle assembleRelease bundleRelease

      - name: Copy artifacts for stable download URLs
        shell: bash
        run: |
          mkdir -p dist
          # Without keystore secrets the release APK is unsigned and AGP names
          # it app-release-unsigned.apk — accept either.
          cp apps/hotshare-android/app/build/outputs/apk/release/app-release.apk dist/hotshare.apk \
            || cp apps/hotshare-android/app/build/outputs/apk/release/app-release-unsigned.apk dist/hotshare.apk
          cp apps/hotshare-android/app/build/outputs/bundle/release/app-release.aab dist/hotshare.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
